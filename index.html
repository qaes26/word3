<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الدليل التفاعلي الشامل لبرنامج Microsoft Word</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<script>
tailwind.config={theme:{extend:{fontFamily:{cairo:['Cairo','sans-serif']},colors:{word:'#2b579a',wordLight:'#3b6eb5',wordDark:'#1e3f6f'}}}}
</script>
<style>
*{font-family:'Cairo',sans-serif;margin:0;padding:0;box-sizing:border-box}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:rgba(43,87,154,0.3);border-radius:9px}
body{background:#f0f4f8;transition:background 0.4s,color 0.4s}
body.dark{background:#0f172a;color:#e2e8f0}
.glass{background:rgba(255,255,255,0.7);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.3)}
body.dark .glass{background:rgba(15,23,42,0.7);border:1px solid rgba(255,255,255,0.08)}
.sidebar-item{transition:all 0.3s ease}
.sidebar-item:hover,.sidebar-item.active{background:rgba(43,87,154,0.15);transform:translateX(-4px)}
body.dark .sidebar-item:hover,body.dark .sidebar-item.active{background:rgba(59,110,181,0.2)}
.card{transition:all 0.35s cubic-bezier(0.4,0,0.2,1)}
.card:hover{transform:translateY(-6px);box-shadow:0 20px 40px rgba(43,87,154,0.15)}
.fade-in{animation:fadeIn 0.5s ease forwards}
@keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.icon-box{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#2b579a,#3b6eb5);color:white;flex-shrink:0}
.grp-title{font-size:1.1rem;font-weight:800;color:#2b579a;margin:24px 0 12px;padding-bottom:8px;border-bottom:2px solid rgba(43,87,154,0.15);display:flex;align-items:center;gap:8px}
.grp-title:first-child{margin-top:0}
body.dark .grp-title{color:#7ba4d4;border-color:rgba(123,164,212,0.2)}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:30}
@media(max-width:768px){.sidebar{transform:translateX(100%);position:fixed!important;z-index:40;top:0;right:0;height:100%}.sidebar.open{transform:translateX(0)}.overlay.show{display:block}}
</style>
</head>
<body class="min-h-screen font-cairo">

<!-- Top Bar -->
<header class="glass fixed top-0 left-0 right-0 z-20 px-4 py-3 flex items-center justify-between shadow-sm">
<div class="flex items-center gap-3">
<button id="menuBtn" class="md:hidden p-2 rounded-xl hover:bg-word/10">
<svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
</button>
<div class="flex items-center gap-2">
<div class="w-9 h-9 rounded-xl bg-gradient-to-br from-word to-wordLight flex items-center justify-center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M21 4H7a1 1 0 00-1 1v14a1 1 0 001 1h14a1 1 0 001-1V5a1 1 0 00-1-1zm-1 14H8V6h12v12zM3 6H2v15a1 1 0 001 1h15v-1H4V6z"/><path d="M14.5 8L12 13.2 9.5 8H8l3.3 8h1.4l3.3-8z"/></svg>
</div>
<h1 class="text-lg font-bold text-word">دليل Word</h1>
</div>
</div>
<button id="themeBtn" class="p-2 rounded-xl hover:bg-word/10 transition">
<svg id="sunIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2b579a" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
<svg id="moonIcon" class="hidden" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e2e8f0" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z"/></svg>
</button>
</header>

<div class="overlay" id="overlay"></div>

<!-- Sidebar -->
<aside id="sidebar" class="sidebar glass fixed top-[60px] right-0 w-64 h-[calc(100vh-60px)] overflow-y-auto p-3 transition-transform duration-300 md:translate-x-0 shadow-lg z-40 md:z-10">
<nav id="nav" class="flex flex-col gap-1"></nav>
</aside>

<!-- Main Content -->
<main id="content" class="pt-[76px] md:mr-64 p-4 md:p-8 min-h-screen transition-all duration-300"></main>

function G(title,svg){
return `<div class="grp-title"><div class="w-8 h-8 rounded-lg bg-word/10 flex items-center justify-center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2b579a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${svg}</svg></div>${title}</div>`;
}
function makeCard(t,s,d,svg){
return `<div class="card glass rounded-2xl p-5 cursor-pointer">
<div class="flex items-start gap-4">
<div class="icon-box"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${svg}</svg></div>
<div class="flex-1 min-w-0">
<div class="flex items-center gap-2 mb-1"><h3 class="font-bold text-base">${t}</h3>${s?`<span class="text-[10px] px-2 py-0.5 rounded-full bg-word/10 text-word font-semibold">${s}</span>`:''}</div>
<p class="text-sm opacity-70 leading-relaxed">${d}</p>
</div></div></div>`;
}

// Build sidebar
const nav=document.getElementById('nav');
tabs.forEach((t,i)=>{
const btn=document.createElement('button');
btn.className=`sidebar-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-right ${i===0?'active':''}`;
btn.innerHTML=`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="opacity-70">${t.icon}</svg><span class="font-semibold text-sm">${t.title}</span>`;
btn.onclick=()=>{
document.querySelectorAll('.sidebar-item').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
showTab(t.id);
if(window.innerWidth<768){sidebar.classList.remove('open');overlay.classList.remove('show')}
};
nav.appendChild(btn);
});

const mainEl=document.getElementById('content');
function showTab(id){
mainEl.innerHTML=`<div class="fade-in max-w-5xl mx-auto">${content[id]}</div>`;
}
showTab('file');

// Theme toggle
const themeBtn=document.getElementById('themeBtn');
themeBtn.onclick=()=>{
document.body.classList.toggle('dark');
document.getElementById('sunIcon').classList.toggle('hidden');
document.getElementById('moonIcon').classList.toggle('hidden');
};

// Mobile menu
const sidebar=document.getElementById('sidebar');
const overlay=document.getElementById('overlay');
document.getElementById('menuBtn').onclick=()=>{sidebar.classList.toggle('open');overlay.classList.toggle('show')};
overlay.onclick=()=>{sidebar.classList.remove('open');overlay.classList.remove('show')};
</script>
</body>
</html>
